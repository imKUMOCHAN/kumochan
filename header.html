<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEADER</title><style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Times New Roman', sans-serif;
      font-size: 29px;
      letter-spacing: 0px;
      line-height: 20px;
    }

    header {
      position: relative;
      height: 60px;
      background-color: #2e0739;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 -9px 18px 9px #370739, 0 2px 18px 13px inset #280d32;
    }

    header img.logo {
      position: relative;
      height: 64px;
      margin-top: 8px;
      z-index: 4;
    }

    nav {
      margin-left: auto;
    }

    nav ul {
      list-style: none;
      display: flex;
      margin: 0;
      padding: 0;
      z-index: 6;
    }

    nav li {
      margin-right: 6px;
      position: relative;
    }

    nav a {
      text-decoration: none;
      color: #b10000;
      text-shadow: #000 2px 2px 1px;
      padding: 7px;
      display: block;
      outline: outset #590000 1px;
      background-color: rgba(36, 0, 0, 0.72);
    }

    nav a:hover {
      color: #f00;
      text-shadow: #ff3636 0 1px 6px;
      transition: all 32ms ease-out;
      animation: jiggle 0.9s steps(2) infinite;
    }

    nav ul ul {
      display: none;
      position: absolute;
      top: 100%;
      background: #360000;
      box-shadow: 1px 2px 11px 2px #000, 0 -3px 11px 2px inset #000;
    }

    nav ul li:hover > ul {
      display: block;
    }

    nav ul ul li {
      width: 188px;
      font-size: 19px;
      letter-spacing: -1px;
      line-height: 4px;
      float: none;
      display: list-item;
      position: relative;
    }

    @keyframes jiggle {
      0% {
        transform: rotate(0deg) translate(-0.5px, -0.5px);
        letter-spacing: -1.2px;
      }

      25% {
        transform: rotate(0.2deg) translate(0.4px, 0.2px);
        letter-spacing: -1.1px;
      }

      50% {
        transform: rotate(-0.1deg) translate(0, 0);
        letter-spacing: -1.3px;
      }

      75% {
        transform: rotate(0.2deg) translate(-1px, -0.5px);
        letter-spacing: -1.2px;
      }

      100% {
        transform: rotate(0.3deg) translate(-0.1px, -0.5px);
        letter-spacing: -1.3px;
      }
    }
  </style>
</head>
