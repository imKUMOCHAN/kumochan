<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMOCHAN's web site</title>
</head>
<body>
    <div id="header-container" style="height: 80px"></div>
    <p>
        Hello, and welcome to my (KUMOCHAN's) website.
        This website will be filled with everything I can possibly fit about my interests, hobbies,
        projects, and daily life.

        I hope you may find some of these things as interesting as I do.
    </p>
</body>
<script>
    const ambbgm = new Audio('/web-assets/aud/newerlook.mp3');
    ambbgm.volume = 0.2;
    ambbgm.play();
    ambbgm.loop = true;

    fetch('/header.html').then(response => response.text()).then(html => {
      document.getElementById('header-container').innerHTML = html;
    }).catch(error => console.error('error fetching header:', error));
</script>
</html>
